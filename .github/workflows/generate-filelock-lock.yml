name: Generate targeted filelock lock

on:
  push:
    branches: [sobolevnrm/filelock-security-update]
    paths: [.github/workflows/generate-filelock-lock.yml]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.10'
      - name: Generate targeted lock
        run: |
          cat > /tmp/filelock-constraints.txt <<'EOF'
          filelock==3.32.5; python_version < "3.11"
          filelock==4.2.4; python_version >= "3.11"
          torch==2.14.0
          EOF
          uv pip compile pyproject.toml requirements-ci.in \
            --extra test --extra pkaani --universal --python-version 3.10 \
            --generate-hashes --torch-backend cpu \
            --constraint /tmp/filelock-constraints.txt \
            --no-annotate \
            --custom-compile-command 'uv pip compile pyproject.toml requirements-ci.in --extra test --extra pkaani --universal --python-version 3.10 --generate-hashes --torch-backend cpu --output-file requirements-ci.txt' \
            --output-file requirements-ci.txt
          uv pip compile pyproject.toml requirements-ci.in \
            --extra test --extra pkaani --universal --python-version 3.10 \
            --generate-hashes --torch-backend cpu \
            --custom-compile-command 'uv pip compile pyproject.toml requirements-ci.in --extra test --extra pkaani --universal --python-version 3.10 --generate-hashes --torch-backend cpu --output-file requirements-ci.txt' \
            --output-file requirements-ci.txt
      - uses: actions/upload-artifact@v7
        with:
          name: filelock-lock
          path: requirements-ci.txt
