# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'noci')"

    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Lint with ruff
        run: |
          # stop the build if there are Python syntax errors or undefined names
          uvx ruff check . --config=ruff_essential.toml --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          uvx ruff check . --exit-zero --statistics

  test-without-coverage:
    name: Test without coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'noci')"
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv and activate environment
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: "true"
      - name: Install dependencies
        run: uv pip install -e '.[test,pkaani]'
        env:
          UV_TORCH_BACKEND: cpu
      - name: Test full suite
        run: pytest

  test-with-coverage:
    name: Test with coverage (Python 3.14)
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'noci')"
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install uv and activate environment
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: "true"
      - name: Install dependencies
        run: uv pip install -e '.[test,pkaani]'
        env:
          UV_TORCH_BACKEND: cpu
      - name: Test with pytest and coverage
        run: |
          coverage run -m pytest
          coverage report -m | tee coverage.txt
          coverage xml
          coverage html
      - name: Upload coverage results
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          files: ./coverage.xml
          use_oidc: true
      - name: Store coverage text results
        uses: actions/upload-artifact@v5
        with:
          name: coverage-text
          path: coverage.txt
      - name: Store coverage HTML results
        uses: actions/upload-artifact@v5
        with:
          name: coverage-html
          path: htmlcov/*
