name: Generate urllib3 security update

on:
  push:
    branches: [fix/urllib3-security-alerts]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.10"
      - name: Update urllib3 only
        run: |
          uv pip compile pyproject.toml requirements-ci.in \
            --extra test \
            --extra pkaani \
            --universal \
            --python-version 3.10 \
            --generate-hashes \
            --torch-backend cpu \
            --upgrade-package urllib3==2.8.0 \
            --custom-compile-command 'uv pip compile pyproject.toml requirements-ci.in --extra test --extra pkaani --universal --python-version 3.10 --generate-hashes --torch-backend cpu --output-file requirements-ci.txt' \
            --output-file requirements-ci.txt
      - uses: actions/upload-artifact@v7
        with:
          name: urllib3-security-lock
          path: requirements-ci.txt
          if-no-files-found: error
